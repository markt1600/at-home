<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Memory studio · At Home</title></head><body><div id="studio"><main class="boot" aria-live="polite"><p>Opening the memory studio…</p></main></div><script>
// A classic script, so it runs even if the studio module fails to load or parse:
// instead of a blank page, say what went wrong.
(function(){var studio=document.getElementById('studio');function report(detail){var boot=studio.querySelector('.boot');if(!boot){boot=document.createElement('main');boot.className='boot';studio.appendChild(boot);}boot.innerHTML='<p><strong>The memory studio could not start.</strong></p><p class="boot-detail"></p><p>Reload to try again. If it keeps happening, send this message along.</p>';boot.querySelector('.boot-detail').textContent=detail+' · '+navigator.userAgent;}
window.addEventListener('error',function(e){if(studio.querySelector('[data-studio-ready]'))return;var t=e.target;if(t&&t!==window&&(t.src||t.href))report('Could not load '+String(t.src||t.href).replace(/^.*\//,'')+'. Check the connection and reload.');else report((e.message||'Script error')+(e.filename?' ('+e.filename.replace(/^.*\//,'')+':'+e.lineno+')':''));},true);
window.addEventListener('unhandledrejection',function(e){var r=e.reason;if(!studio.querySelector('[data-studio-ready]'))report(r&&r.message?r.message+(r.stack?' — '+String(r.stack).split('\n').slice(0,2).join(' '):''):String(r));});
setTimeout(function(){if(!studio.querySelector('[data-studio-ready]')&&studio.querySelector('.boot')&&!studio.querySelector('.boot-detail'))report('The studio script did not finish loading after 20 seconds.');},20000);})();
</script><script type="module" src="/src/admin.js"></script></body></html>
